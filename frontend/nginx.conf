# Docker's embedded DNS. Re-resolve replica names every 5s, so a replica that
# restarts with a new IP is picked up without restarting nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

# Round-robin over the API replicas. If one can't be reached, nginx retries
# the request on the other (proxy_next_upstream, on by default for connection
# errors and timeouts), and skips the failed one for fail_timeout.
upstream api {
    zone api 64k;
    server backend-1:8000 resolve max_fails=1 fail_timeout=5s;
    server backend-2:8000 resolve max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fail fast when a replica is down (2s instead of nginx's default 60s), so
    # nginx moves on to the next replica, or the client starts its own retry.
    proxy_connect_timeout 2s;

    # SSE streams: must not be buffered, and must stay open for a long time.
    location ~ ^/api/orders/[^/]+/events$ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
